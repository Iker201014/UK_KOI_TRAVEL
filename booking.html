<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Japan Koi Trip Booking</title>
    <link rel="stylesheet" href="booking.css">
</head>

<body>

    <header class="top-bar">
        <div class="logo">
            <img src="Koi-fish-logo.png" alt="Logo">
        </div>

        <nav class="navbar">
            <a href="UK_KOI_TRAVEL.html">Home</a>
            <a href="gallery.html">Gallery</a>
            <a href="booking.html">Booking</a>
        </nav>
    </header>

    <main class="booking-page">
        <div class="booking-box">

            <h1>Japan Koi Trip Booking</h1>
            <p class="subtitle">Please fill in your details and we will contact you.</p>

            <div class="price">£3200 per person</div>

            <div class="includes">
                <h2>Package Includes</h2>
                <ul>
                    <li>Flight</li>
                    <li>Hotel</li>
                    <li>Breakfast</li>
                    <li>Koi tour to the koi farms</li>
                </ul>
            </div>

            <form class="booking-form">
                <input type="text" placeholder="Full Name" required>
                <input type="email" placeholder="Email Address" required>
                <input type="tel" placeholder="Phone Number">
                <input type="number" placeholder="Number of Travellers" min="1">
                <input type="text" placeholder="Preferred Travel Dates">
                <textarea placeholder="Additional Details or Questions"></textarea>

                <button type="submit">Send Request</button>
            </form>

        </div>
    </main>

</body>
</html>
